<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JilFlix - Search, Stream & Download</title>
<style>
:root{--red:#e50914;--red2:#b20710;--bg:#000;--card:#0b0b0d;--line:#222226;--mut:#9a9aa3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 400px at 0% 0%,rgba(229,9,20,.18),transparent 60%),radial-gradient(900px 400px at 100% 100%,rgba(229,9,20,.14),transparent 60%),#000;background-attachment:fixed;color:#fff;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.nav{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo{height:46px;cursor:pointer;display:block;mix-blend-mode:lighten}
.badge18{background:var(--red);font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
form{flex:1;min-width:240px;display:flex;gap:8px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;background:#121214;border:1px solid #2c2c31;color:#fff;padding:12px 16px 12px 42px;border-radius:14px;font-size:14px;transition:.2s}
.sbox input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(229,9,20,.25)}
.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2}
.btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:none;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;box-shadow:0 6px 20px rgba(229,9,20,.35)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
main{width:100%;max-width:1200px;margin:0 auto;padding:24px 16px 48px;flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#121214;border:1px solid #2c2c31;color:#cfcfd6;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 16px rgba(229,9,20,.4)}
.hero{text-align:center;padding:56px 16px}
.hero img{width:min(420px,80%);margin:0 auto 24px;display:block;mix-blend-mode:lighten}
.hero p{color:var(--mut);font-size:14px;max-width:460px;margin:0 auto;line-height:1.6}
.hero b{color:#fff}
.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.title-row h2{font-size:18px;font-weight:800}
.title-row h2 span{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.vcard:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 12px 30px rgba(229,9,20,.25)}
.thumb{position:relative;aspect-ratio:16/9;background:#141416 center/cover no-repeat}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.thumb .src{position:absolute;left:8px;top:8px;background:var(--red);font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;background:rgba(0,0,0,.35)}
.vcard:hover .play{opacity:1}
.play i{width:48px;height:48px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-style:normal}
.vinfo{padding:12px}
.vinfo h3{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vinfo small{color:var(--mut);font-size:11px;display:block;margin-top:6px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 0;text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #222;border-top-color:var(--red);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center p{margin-top:16px;color:var(--mut)}
.err{background:var(--card);border:1px solid rgba(229,9,20,.35);border-radius:20px;padding:40px 20px;text-align:center}
.err p{color:#ff5a64;font-weight:600;margin:10px 0 18px}
.btn2{background:#1c1c20;color:#fff;border:1px solid #2c2c31;padding:10px 20px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
.btn2:hover{background:#26262b}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111114;border-bottom:1px solid var(--line)}
#site-badge{font-size:11px;color:#ff4d57;background:rgba(229,9,20,.15);border:1px solid rgba(229,9,20,.4);padding:4px 12px;border-radius:999px;font-weight:800;text-transform:uppercase}
.player{background:#000;aspect-ratio:16/9}
video{width:100%;height:100%;object-fit:contain}
.det{padding:22px}
#video-title{font-size:20px;font-weight:800;margin-bottom:14px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:16px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.meta b{color:#fff}
.ql label{display:block;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.ql div{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.acts{display:flex;flex-direction:column;gap:12px}
.acts a{text-decoration:none;color:#fff;font-weight:700;padding:14px;border-radius:14px;text-align:center;transition:.2s}
#download-btn{background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 8px 24px rgba(229,9,20,.35);flex:1}
#stream-link-btn{background:#1c1c20;border:1px solid #2c2c31}
.acts a:hover{filter:brightness(1.15)}
@media(min-width:640px){.acts{flex-direction:row}.logo{height:52px}}
footer{border-top:1px solid #151518;padding:22px;text-align:center;font-size:12px;color:#66666e}
</style>
</head>

  {id:'rexporn', domain:'rexporn.sex'},
  {id:'jilhub', domain:'jilhub.org'}
];
// Endpoint builders — change here if your API uses different paths/params
const searchUrl = (site, q) => `${BASE}/${site}/search?query=${encodeURIComponent(q)}&q=${encodeURIComponent(q)}&api_key=${API_KEY}`;
const dlUrl = (site, link) => `${BASE}/${site}/dl?url=${encodeURIComponent(link)}&api_key=${API_KEY}`;

// CORS fallback: set PROXY to your own Cloudflare Worker URL (see worker.js), e.g. "https://jilflix.yourname.workers.dev/?url="
const PROXY = "";
const FALLBACKS = ["https://api.allorigins.win/raw?url=", "https://corsproxy.io/?url="];
async function apiFetch(url){
  const tries = [url, ...(PROXY?[PROXY+encodeURIComponent(url)]:[]), ...FALLBACKS.map(p=>p+encodeURIComponent(url))];
  let lastErr;
  for(const u of tries){
    try{ const r = await fetch(u); if(r.ok || r.status<500) return r; lastErr = new Error('HTTP '+r.status); }
    catch(e){ lastErr = e; }
  }
  throw lastErr;
}
const $ = id => document.getElementById(id);
let activeSite = 'all', lastResults = [], lastQuery = '';

// Chips
function renderChips(){
  $('chips').innerHTML = [{id:'all'},...SITES].map(s =>
    `<button class="chip ${activeSite===s.id?'on':''}" onclick="setSite('${s.id}')">${s.id==='all'?'All Sites':s.id}</button>`).join('');
}
function setSite(id){
  activeSite = id; renderChips();
  if(lastQuery) runSearch(lastQuery);
}
renderChips();

function show(...ids){
  ['home','loader','error','results','detail'].forEach(x => $(x).classList.toggle('hidden', !ids.includes(x)));
}
function goHome(){ lastQuery=''; lastResults=[]; $('q').value=''; show('home'); }
function backToResults(){ lastResults.length ? show('results') : goHome(); $('player').pause(); }
function fail(msg){ $('error-msg').innerText = msg; show('error'); }
function loading(t){ $('loader-text').innerText = t; show('loader'); }

function handleSubmit(e){
  e.preventDefault();
  const v = $('q').value.trim();
  if(!v) return;
  if(/^https?:\/\//i.test(v)){
    const s = SITES.find(x => v.includes(x.domain));
    if(!s) return fail('Unsupported link. Use XNXX, Pornhub, XVideos, SpankBang, RexPorn or Jilhub.');
    openVideo(s.id, v);
  } else runSearch(v);
}

// Flexible parsing of whatever shape the API returns
function pickList(d){
  if(Array.isArray(d)) return d;
  for(const k of ['results','data','result','videos','items','list']){
    if(Array.isArray(d?.[k])) return d[k];
    if(d?.[k] && typeof d[k]==='object'){ const r = pickList(d[k]); if(r.length) return r; }
  }
  return [];
}
function absUrl(u, site){
  if(!u) return '';
  if(/^https?:\/\//i.test(u)) return u;
  if(u.startsWith('//')) return 'https:'+u;
  const dom = SITES.find(s=>s.id===site).domain;
  return 'https://www.'+dom.replace(/^www\./,'')+(u.startsWith('/')?u:'/'+u);
}
function norm(it, site){
  return {
    site,
    title: it.title || it.name || 'Untitled',
    link: absUrl(it.url || it.link || it.video_url || it.href || it.page_url || '', site),
    raw: it,
    thumb: it.thumbnail || it.thumb || it.image || it.img || it.poster || it.preview || '',
    duration: it.duration || it.time || '',
    views: it.views || it.view || ''
  };
}

async function runSearch(q){
  lastQuery = q;
  const sites = activeSite==='all' ? SITES.map(s=>s.id) : [activeSite];
  loading(`Searching ${activeSite==='all'?'all sites':activeSite.toUpperCase()}...`);
  const settled = await Promise.allSettled(sites.map(async site => {
    const r = await apiFetch(searchUrl(site,q));
    const d = await r.json();
    return pickList(d).map(i => norm(i, site)).filter(i => i.link);
  }));
  const out = [];
  const maxLen = Math.max(0,...settled.map(s => s.status==='fulfilled'? s.value.length:0));
  for(let i=0;i<maxLen;i++) settled.forEach(s => { if(s.status==='fulfilled' && s.value[i]) out.push(s.value[i]); });
  lastResults = out;
  if(!out.length) return fail(`No results found for "${q}". Try another keyword or site.`);
  renderResults(q);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderResults(q){
  $('res-q').innerText = `"${q}"`;
  $('res-count').innerText = `${lastResults.length} videos`;
  $('grid').innerHTML = lastResults.map((v,i) => `
    <div class="vcard" onclick="openVideo('${v.site}', lastResults[${i}].link)">
      <div class="thumb" style="background-image:url('${esc(v.thumb)}')">
        <span class="src">${v.site}</span>
        ${v.duration?`<span class="dur">${esc(v.duration)}</span>`:''}
        <div class="play"><i>▶</i></div>
      </div>
      <div class="vinfo"><h3>${esc(v.title)}</h3><small>${v.views?'👁️ '+esc(v.views):'&nbsp;'}</small></div>
    </div>`).join('');
  show('results');
  window.scrollTo({top:0,behavior:'smooth'});
}

async function openVideo(site, link){
  loading(`Connecting to ${site.toUpperCase()}...`);
  try{
    const r = await apiFetch(dlUrl(site, link));
    const txt = await r.text();
    let d; try{ d = JSON.parse(txt); }catch(_){ return fail(`Server returned an invalid response (HTTP ${r.status}).`); }
    if(d.success === false || (!d.success && !d.stream_url && !d.streams && !d.download_url))
      return fail((d.message || d.error || 'Failed to load video. The link may be invalid or expired.'));
    renderDetail(d, site);
  }catch(e){
    console.error(e);
    fail('Could not reach the API. Open this page in a normal browser (Chrome) from a real host (Netlify / GitHub Pages / localhost), not from a file preview, and turn off ad-blockers.');
  }
}

function renderDetail(d, site){
  $('site-badge').innerText = site.toUpperCase();
  $('video-title').innerText = d.title || `${site.toUpperCase()} Video`;
  $('v-views').innerText = d.views || 'N/A';
  $('v-dur').innerText = d.duration || 'N/A';
  $('v-date').innerText = d.upload_date || 'N/A';
  const p = $('player'), dl = $('download-btn'), st = $('stream-link-btn');
  p.poster = d.thumbnail || '';
  $('ql').classList.add('hidden'); $('ql-btns').innerHTML = '';

  if(site==='rexporn' && d.streams && d.streams.length){
    const set = s => { p.src = s.stream_url; dl.href = s.download_url; st.href = s.stream_url; };
    set(d.streams[0]);
    $('ql').classList.remove('hidden');
    d.streams.forEach((s,i) => {
      const b = document.createElement('button');
      b.type='button'; b.className = 'chip'+(i===0?' on':''); b.innerText = s.label;
      b.onclick = () => { document.querySelectorAll('#ql-btns .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); set(s); p.play(); };
      $('ql-btns').appendChild(b);
    });
  } else {
    const s = d.stream_url || d.direct_url || d.video_url;
    p.src = s; dl.href = d.download_url || d.dl_link || s; st.href = s;
  }
  show('detail');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
